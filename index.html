      font-size: 10px !important;
    }
    .leaflet-control-attribution a {
      color: #0284C7 !important;
    }

    /* Official Credential Card Guilloche Pattern */
    .credential-card {
      background: #FFFFFF;
      background-image: radial-gradient(#CBD5E1 0.65px, transparent 0.65px);
      background-size: 14px 14px;
      position: relative;
      overflow: hidden;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.75; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .sos-pulse {
      animation: pulseRing 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF !important; }
    }

    // Deterministic Crisp Vector QR Code Component
    const TouristQRCode = ({ value, size = 148 }) => {
      const matrix = useMemo(() => {
        const grid = 21;
        const cells = [];
        let hash = 2166136261;
        for (let i = 0; i < value.length; i++) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        const isFinder = (r, c) => {
          if (r < 7 && c < 7) return true;
          if (r < 7 && c >= grid - 7) return true;
          if (r >= grid - 7 && c < 7) return true;
          return false;
        };
        const finderVal = (r, c) => {
          const lr = r >= grid - 7 ? r - (grid - 7) : r;
          const lc = c >= grid - 7 ? c - (grid - 7) : c;
          if (lr === 0 || lr === 6 || lc === 0 || lc === 6) return 1;
          if (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4) return 1;
          return 0;
        };
        for (let r = 0; r < grid; r++) {
          const row = [];
          for (let c = 0; c < grid; c++) {
            if (isFinder(r, c)) {
              row.push(finderVal(r, c));
            } else {
              const seed = Math.abs(Math.sin(hash + r * 31 + c * 17) * 10000);
              row.push(seed - Math.floor(seed) > 0.48 ? 1 : 0);
            }
          }
          cells.push(row);
        }
        return cells;
      }, [value]);

      const cellSize = size / 21;
      return (
        <div className="p-3 bg-white rounded-xl border border-slate-200 shadow-sm inline-block">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="block">
            <rect width={size} height={size} fill="#FFFFFF" />
            {matrix.map((row, r) =>
              row.map((val, c) =>
                val ? (
                  <rect
                    key={`${r}-${c}`}
                    x={c * cellSize}
                    y={r * cellSize}
                    width={cellSize + 0.3}
                    height={cellSize + 0.3}
                    fill="#0B1F3A"
                    rx={cellSize * 0.15}
                  />
                ) : null
              )
            )}
          </svg>
        </div>
      );
    };

        // 4. Response Teams

    function App() {
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem('safeway_platform_v1');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }

      }, []);

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 4500);
        return () => clearTimeout(timer);
      }, [toast]);

      const resetDemoData = () => {
        localStorage.removeItem('safeway_platform_v1');
        setDb(INITIAL_DATA);
        setActiveTouristId('SW-IND-2026-8492');
        showToast('System Data Restored', 'All 20 tourists, incidents, AI alerts, and geo-fences reset to baseline.', 'success');
      };

      const currentTourist = useMemo(
        () => db.tourists.find(item => item.id === activeTouristId) || db.tourists[0],
        [db.tourists, activeTouristId]
      );

      const activeTouristIncident = useMemo(
        () => db.incidents.find(inc => inc.touristId === currentTourist.id && inc.status !== 'Resolved'),
        [db.incidents, currentTourist.id]
      );

      // =====================================================================
      // CORE WORKFLOW ACTIONS (CONNECTED TOURIST <-> AUTHORITY)
      // =====================================================================
      const triggerTouristSOS = (customReason = "SOS Emergency", customTouristId = null) => {
        const targetId = customTouristId || currentTourist.id;
        const targetTourist = db.tourists.find(x => x.id === targetId) || currentTourist;

        const existing = db.incidents.find(i => i.touristId === targetId && i.status !== 'Resolved' && i.type === customReason);
        if (existing) {
          showToast('SOS Already Active', `Incident ${existing.id} is currently active in Authority Command.`, 'warning');
          return existing;
        }

        const newIncId = `INC-2026-${Math.floor(910 + Math.random() * 89)}`;
        const newIncident = {
          id: newIncId,
          touristId: targetTourist.id,
          touristName: targetTourist.name,
          type: customReason,
          severity: "Critical",
          location: `${targetTourist.locationName} (${targetTourist.lat.toFixed(4)}, ${targetTourist.lng.toFixed(4)})`,
          lat: targetTourist.lat,
          lng: targetTourist.lng,
          time: "Just now",
          status: "New",
          assignedTeam: "Alpha Coastal Rescue (Goa)",
          notes: [
            `[SIMULATED DEMO] ${customReason} triggered by ${targetTourist.name}.`,
            `GPS Telemetry locked & Emergency Contact (${targetTourist.emergencyContact}) notified.`
          ],
          stage: 4
        };

        setDb(prev => ({
          ...prev,
          incidents: [newIncident, ...prev.incidents],
          tourists: prev.tourists.map(item =>
            item.id === targetTourist.id
              ? { ...item, status: 'Emergency', safetyScore: Math.min(item.safetyScore, 28) }
              : item
          ),
          devices: prev.devices.map(dev =>
            dev.touristId === targetTourist.id
              ? { ...dev, status: 'SOS Triggered', heartRate: 138 }
              : dev
          )
        }));

        showToast(
          `EMERGENCY ALERT: ${newIncId}`,
          `Simulated SOS activated for ${targetTourist.name}. Authority Command Centre notified immediately!`,
          'error'
        );
        return newIncident;
      };

      const updateIncident = (incId, updates, newNote = null) => {
        setDb(prev => {
          const targetInc = prev.incidents.find(i => i.id === incId);
          const updatedIncidents = prev.incidents.map(inc => {
            if (inc.id !== incId) return inc;
            const stageMap = {
              'New': 3,
              'Investigating': 4,
              'Team Dispatched': 5,
              'Resolved': 6
            };
            const nextStatus = updates.status || inc.status;
            return {
              ...inc,
              ...updates,
              stage: stageMap[nextStatus] || inc.stage,
              notes: newNote ? [...inc.notes, newNote] : inc.notes
            };
          });

          let updatedTourists = prev.tourists;
          let updatedDevices = prev.devices;
          if (updates.status === 'Resolved' && targetInc) {
            updatedTourists = prev.tourists.map(tItem =>
              tItem.id === targetInc.touristId
                ? { ...tItem, status: 'Safe', safetyScore: 89 }
                : tItem
            );
            updatedDevices = prev.devices.map(dItem =>
              dItem.touristId === targetInc.touristId
                ? { ...dItem, status: 'Online', heartRate: 78 }
                : dItem
            );
          }

          return {
            ...prev,
            incidents: updatedIncidents,
            tourists: updatedTourists,
            devices: updatedDevices
          };
        });

        showToast('Incident Updated', `${incId} synchronized across Authority & Tourist dashboards.`, 'success');
      };

      const escalateAiAlert = (alertId) => {
        const alertObj = db.aiAlerts.find(a => a.id === alertId);
        if (!alertObj) return;
        const touristObj = db.tourists.find(tItem => tItem.id === alertObj.touristId) || db.tourists[0];

        const newIncId = `INC-2026-${Math.floor(920 + Math.random() * 79)}`;
        const createdInc = {
          id: newIncId,
          touristId: touristObj.id,
          touristName: touristObj.name,
          type: alertObj.type.includes('Restricted') ? 'Restricted Zone Entry' : alertObj.type.includes('Inactivity') ? 'Inactivity' : 'Route Deviation',
          severity: alertObj.severity,
          location: touristObj.locationName,
          lat: touristObj.lat,
          lng: touristObj.lng,
          time: "Just now",
          status: "New",
          assignedTeam: "Bravo Tourist Patrol",
          notes: [`Escalated from AI Anomaly ${alertObj.id} (Risk Score: ${alertObj.riskScore}/100).`, alertObj.explanation],
          stage: 4
        };

        setDb(prev => ({
          ...prev,
          aiAlerts: prev.aiAlerts.map(a => a.id === alertId ? { ...a, status: 'Escalated' } : a),
          incidents: [createdInc, ...prev.incidents],
          tourists: prev.tourists.map(tItem =>
            tItem.id === touristObj.id && tItem.status === 'Safe'
              ? { ...tItem, status: 'Caution', safetyScore: Math.max(45, tItem.safetyScore - 20) }
              : tItem
          )
        }));

        showToast('AI Alert Escalated', `Created Incident ${newIncId} in Incident Management.`, 'warning');
      };

      const dismissAiAlert = (alertId) => {
        setDb(prev => ({
          ...prev,
          aiAlerts: prev.aiAlerts.filter(a => a.id !== alertId)
        }));
        showToast('Alert Dismissed', `Simulated AI anomaly ${alertId} archived.`, 'info');
      };

      const addGeoZone = (zoneObj) => {
        const newZone = {
          id: `GF-0${db.zones.length + 1}`,
          ...zoneObj
        };
        setDb(prev => ({
          ...prev,
          zones: [newZone, ...prev.zones]
        }));
        showToast('Geo-Fence Deployed', `${newZone.name} (${newZone.type}) is now active on all maps.`, 'success');
      };

      const simulateZoneBreach = (zone) => {
        const target = db.tourists[1]; // Elena Rostova
        const newIncId = `INC-2026-${Math.floor(930 + Math.random() * 69)}`;
        const breachInc = {
          id: newIncId,
          touristId: target.id,
          touristName: target.name,
          type: "Restricted Zone Entry",
          severity: "High",
          location: `${zone.name} Perimeter`,
          lat: zone.lat,
          lng: zone.lng,
          time: "Just now",
          status: "New",
          assignedTeam: "Bravo Tourist Patrol",
          notes: [`SIMULATED BREACH: Tourist entered ${zone.name} (${zone.type} Zone).`],
          stage: 4
        };

        setDb(prev => ({
          ...prev,
          incidents: [breachInc, ...prev.incidents],
          tourists: prev.tourists.map(item =>
            item.id === target.id
              ? { ...item, lat: zone.lat, lng: zone.lng, locationName: zone.name, status: 'Caution', safetyScore: 54 }
              : item
          )
        }));

        showToast('Geo-Fence Breach Alert!', `${target.name} entered ${zone.name}. Incident ${newIncId} generated.`, 'error');
      };

      const createTrip = (tripData) => {

                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

          {/* VIEW ROUTING */}
          {view === 'landing' && (
            <LandingPage
              t={t}
              db={db}
              LanguageSelector={LanguageSelector}
              onOpenLogin={() => setView('login')}

          {view === 'login' && (

            />
          )}

          {view === 'tourist' && (
            <TouristPortal

              db={db}
              currentTourist={currentTourist}
              activeTab={touristTab}
              setActiveTab={setTouristTab}

              onTriggerSOS={triggerTouristSOS}

              onToggleMonitoring={toggleMonitoring}
              LanguageSelector={LanguageSelector}
              onSwitchRole={() => setView('login')}
              onGoHome={() => setView('landing')}
              onResetDemo={resetDemoData}
              mobileSidebarOpen={mobileSidebarOpen}
              setMobileSidebarOpen={setMobileSidebarOpen}
            />
          )}

          {view === 'authority' && (
            <AuthorityPortal
              t={t}
              db={db}
              activeTab={authorityTab}
              setActiveTab={setAuthorityTab}
              onUpdateIncident={updateIncident}
              onEscalateAi={escalateAiAlert}

              onResetDemo={resetDemoData}
              mobileSidebarOpen={mobileSidebarOpen}
              setMobileSidebarOpen={setMobileSidebarOpen}
            />
          )}
        </div>
      );
    }

      const [messages, setMessages] = useState([

      const generateReply = (prompt) => {
        const q = prompt.toLowerCase();
        if (q.includes('route')) {
          return `Route Safety Analysis for ${currentTourist.destination}: Your current corridor near ${currentTourist.locationName} is rated LOW RISK (94% safe). Avoid unguarded cliff trails near Fort Aguada (GF-02) after 19:00 IST due to low visibility and high-tide surf.`;

          const safeZones = db.zones.filter(z => z.type === 'Safe').map(z => `• ${z.name} (${z.description})`).join('\n');
          return `Verified Safe Zones active on your radar:\n${safeZones}\nNearest Tourist Police Assistance Booth is 350m away.`;

        if (q.includes('emergency') || q.includes('what should i do')) {
          return `Emergency Protocol:\n1. Tap the red SOS button in SAFEWAY (or hold your Smart Band button for 3 seconds).\n2. Move toward a well-lit Safe Zone or verified hotel lobby.\n3. Keep your Digital ID (${currentTourist.id}) ready for responders. Note: This demo simulates dispatch inside SAFEWAY.`;

    // 8A. Authority Overview Dashboard (8 KPIs + Tactical Map + Live Feed)

      const totalTourists = db.tourists.length;
      const activeMonitored = db.tourists.filter(x => x.monitoring).length;
      const activeEmergencies = db.incidents.filter(i => i.status !== 'Resolved' && (i.severity === 'Critical' || i.type === 'SOS Emergency')).length;
      const missingTourists = db.incidents.filter(i => i.type === 'Missing Tourist' && i.status !== 'Resolved').length;
      const highRiskAlerts = db.incidents.filter(i => i.status !== 'Resolved' && i.severity === 'High').length;
      const resolvedIncidents = db.incidents.filter(i => i.status === 'Resolved').length;
      const aiAlertsCount = db.aiAlerts.length;
      const teamsCount = db.responseTeams.length;

      const kpis = [
        { label: "Total Registered Tourists", val: totalTourists, icon: "users", color: "navy" },
        { label: t.activeTourists, val: activeMonitored, icon: "radar", color: "teal" },
        { label: t.activeEmergencies, val: activeEmergencies, icon: "siren", color: "red" },
        { label: "Missing Tourists", val: missingTourists, icon: "user-x", color: "amber" },
        { label: "High-Risk Alerts", val: highRiskAlerts, icon: "alert-triangle", color: "amber" },
        { label: t.resolvedIncidents, val: resolvedIncidents, icon: "check-circle-2", color: "teal" },
        { label: "AI Anomaly Alerts", val: aiAlertsCount, icon: "brain-circuit", color: "sky" },
        { label: t.responseTeams, val: teamsCount, icon: "truck", color: "navy" }

      return (
        <div className="space-y-6">
          {/* 8 KPI Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {kpis.map((k, idx) => (
              <div key={idx} className="gov-card rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-[11px] text-slate-500 font-semibold">{k.label}</div>
                  <div className={`text-2xl sm:text-3xl font-extrabold mt-1 ${
                    k.color === 'red' ? 'text-red-600' :
                    k.color === 'amber' ? 'text-amber-600' :
                    k.color === 'teal' ? 'text-teal-700' : 'text-gov-900'
                  }`}>{k.val}</div>
                </div>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center border ${
                  k.color === 'red' ? 'bg-red-50 border-red-200 text-red-600' :
                  k.color === 'amber' ? 'bg-amber-50 border-amber-200 text-amber-600' :
                  k.color === 'teal' ? 'bg-teal-50 border-teal-200 text-teal-700' :
                  'bg-gov-100 border-slate-200 text-gov-900'
                }`}>
                  <Icon name={k.icon} className="w-5 h-5" />
                </div>
              </div>
            ))}
          </div>

          {/* Tactical Map + Live Incident & Team Status */}
          <div className="grid lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-extrabold text-gov-900 flex items-center gap-2">
                  <Icon name="globe-2" className="w-4 h-4 text-teal-600" /> Live Tactical Command Map
                </h2>
                <button onClick={() => onNavigate('geofence')} className="text-xs font-bold text-sky-700 hover:underline">
                  Manage Geo-Fences →
                </button>
              </div>
              <InteractiveSafetyMap
                tourists={db.tourists}
                zones={db.zones}
                incidents={db.incidents}
                teams={db.responseTeams}
                heightClass="h-[430px]"
              />
            </div>

            <div className="lg:col-span-4 space-y-5">
              {/* Active Incidents Feed */}
              <div className="gov-card rounded-xl p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-extrabold text-gov-900">Priority Incident Feed</h3>
                  <button onClick={() => onNavigate('incidents')} className="text-xs font-bold text-sky-700 hover:underline">View All</button>
                </div>

                <div className="space-y-2.5 max-h-[230px] overflow-y-auto pr-1">
                  {db.incidents.filter(i => i.status !== 'Resolved').map(inc => (
                    <div
                      key={inc.id}
                      onClick={() => onNavigate('incidents')}
                      className="p-3 rounded-xl bg-gov-50 border border-slate-200 hover:border-red-400 cursor-pointer transition"
                    >
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-mono font-bold text-red-700">{inc.id}</span>
                        <span className="px-2 py-0.5 rounded bg-red-100 text-red-800 font-bold">{inc.status}</span>
                      </div>
                      <div className="text-xs font-bold text-gov-900 mt-1">{inc.type} — {inc.touristName}</div>

                        <div className="text-[11px] text-slate-500">{rt.location}</div>

                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${

              </div>

          </div>
        </div>

    // 8B. Incident Management View
    function IncidentManagementView({ db, onUpdateIncident }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [typeFilter, setTypeFilter] = useState('All');
      const [selectedIncId, setSelectedIncId] = useState(db.incidents[0]?.id || null);
      const [noteInput, setNoteInput] = useState('');

      const filtered = db.incidents.filter(inc => {
        const matchesSearch =
          inc.id.toLowerCase().includes(search.toLowerCase()) ||
          inc.touristName.toLowerCase().includes(search.toLowerCase()) ||
          inc.location.toLowerCase().includes(search.toLowerCase());
        const matchesStatus = statusFilter === 'All' || inc.status === statusFilter;
        const matchesType = typeFilter === 'All' || inc.type === typeFilter;
        return matchesSearch && matchesStatus && matchesType;
      });

      const selectedInc = db.incidents.find(i => i.id === selectedIncId) || filtered[0];

      return (
        <div className="space-y-6">
          {/* Search & Filters Bar */}
          <div className="gov-card rounded-xl p-4 flex flex-wrap items-center gap-3">
            <div className="flex-1 min-w-[200px] relative">
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search Incident ID, Tourist Name, or Location..."
                className="w-full bg-gov-50 border border-slate-300 rounded-xl pl-3.5 pr-4 py-2 text-xs text-gov-900 focus:border-teal-600 focus:bg-white focus:outline-none"
              />
            </div>

            <select
              value={statusFilter}
              onChange={e => setStatusFilter(e.target.value)}
              className="bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-gov-900"
            >
              <option value="All">All Statuses</option>
              <option value="New">New</option>
              <option value="Investigating">Investigating</option>
              <option value="Team Dispatched">Team Dispatched</option>
              <option value="Resolved">Resolved</option>
            </select>

            <select
              value={typeFilter}
              onChange={e => setTypeFilter(e.target.value)}
              className="bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-gov-900"
            >
              <option value="All">All Incident Types</option>
              <option value="SOS Emergency">SOS Emergency</option>
              <option value="Route Deviation">Route Deviation</option>
              <option value="Restricted Zone Entry">Restricted Zone Entry</option>
              <option value="Medical Emergency">Medical Emergency</option>
              <option value="Inactivity">Inactivity</option>
              <option value="Missing Tourist">Missing Tourist</option>
            </select>
          </div>

          <div className="grid lg:grid-cols-12 gap-6">
            {/* Incidents Table */}
            <div className="lg:col-span-7 gov-card rounded-xl overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gov-900 text-white text-[11px] font-mono uppercase">
                      <th className="py-3 px-4">Incident</th>
                      <th className="py-3 px-4">Tourist</th>
                      <th className="py-3 px-4">Severity</th>
                      <th className="py-3 px-4">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-xs">
                    {filtered.map(inc => (
                      <tr
                        key={inc.id}
                        onClick={() => setSelectedIncId(inc.id)}
                        className={`cursor-pointer transition ${selectedInc?.id === inc.id ? 'bg-sky-50' : 'hover:bg-slate-50'}`}
                      >
                        <td className="py-3.5 px-4">
                          <div className="font-mono font-bold text-sky-800">{inc.id}</div>
                          <div className="font-bold text-gov-900">{inc.type}</div>
                          <div className="text-[11px] text-slate-500">{inc.time}</div>
                        </td>
                        <td className="py-3.5 px-4">
                          <div className="font-bold text-gov-900">{inc.touristName}</div>
                          <div className="text-[11px] text-slate-500 truncate max-w-[160px]">{inc.location}</div>
                        </td>
                        <td className="py-3.5 px-4">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                            inc.severity === 'Critical' ? 'bg-red-50 border-red-200 text-red-700' :
                            inc.severity === 'High' ? 'bg-amber-50 border-amber-200 text-amber-700' :
                            'bg-sky-50 border-sky-200 text-sky-700'
                          }`}>
                            {inc.severity}
                          </span>
                        </td>
                        <td className="py-3.5 px-4">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            inc.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' :
                            inc.status === 'Team Dispatched' ? 'bg-sky-100 text-sky-800' :
                            inc.status === 'Investigating' ? 'bg-amber-100 text-amber-800' :
                            'bg-red-600 text-white'
                          }`}>
                            {inc.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Incident Detail & Dispatch Inspector */}
            {selectedInc && (
              <div className="lg:col-span-5 gov-card rounded-xl p-6 space-y-5">
                <div className="flex items-start justify-between border-b border-slate-200 pb-4">
                  <div>
                    <span className="text-xs font-mono font-bold text-sky-700">{selectedInc.id} • {selectedInc.touristId}</span>
                    <h3 className="text-lg font-extrabold text-gov-900 mt-0.5">{selectedInc.type}</h3>
                    <div className="text-xs text-slate-600">Tourist: <strong>{selectedInc.touristName}</strong></div>
                  </div>
                  {selectedInc.status !== 'Resolved' && (
                    <button
                      onClick={() => onUpdateIncident(selectedInc.id, { status: 'Resolved' }, 'Incident marked RESOLVED by Command Supervisor.')}
                      className="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs shadow-xs"
                    >
                      Resolve Incident
                    </button>
                  )}
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Update Incident Status</label>
                    <select
                      value={selectedInc.status}
                      onChange={e => onUpdateIncident(selectedInc.id, { status: e.target.value }, `Status changed to ${e.target.value}.`)}
                      className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 font-semibold text-gov-900"
                    >
                      <option value="New">New</option>
                      <option value="Investigating">Investigating</option>
                      <option value="Team Dispatched">Team Dispatched</option>
                      <option value="Resolved">Resolved</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Assign Response Unit</label>
                    <select
                      value={selectedInc.assignedTeam}
                      onChange={e => onUpdateIncident(selectedInc.id, { assignedTeam: e.target.value, status: selectedInc.status === 'New' ? 'Team Dispatched' : selectedInc.status }, `Assigned unit: ${e.target.value}.`)}
                      className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 font-semibold text-gov-900"
                    >
                      <option value="Unassigned">Unassigned</option>
                      {db.responseTeams.map(rt => (
                        <option key={rt.id} value={rt.name}>{rt.name} ({rt.status})</option>
                      ))}
                    </select>
                  </div>

                  {/* Investigation Notes */}
                  <div className="pt-2">
                    <div className="text-gov-900 font-bold mb-2">Investigation & Dispatch Log</div>
                    <div className="space-y-1.5 max-h-36 overflow-y-auto bg-gov-50 p-3 rounded-xl border border-slate-200">
                      {selectedInc.notes.map((n, idx) => (
                        <div key={idx} className="text-[11px] text-slate-700 border-l-2 border-teal-600 pl-2">
                          {n}
                        </div>
                      ))}
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!noteInput.trim()) return;
                        onUpdateIncident(selectedInc.id, {}, noteInput);
                        setNoteInput('');
                      }}
                      className="mt-2.5 flex gap-2"
                    >
                      <input
                        value={noteInput}
                        onChange={e => setNoteInput(e.target.value)}
                        placeholder="Add officer note..."
                        className="flex-1 bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-gov-900"
                      />
                      <button type="submit" className="px-3.5 py-2 rounded-xl bg-gov-900 text-white font-bold text-xs">
                        Add
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 8C. AI Anomaly Detection View
    function AIAnomalyView({ db, onEscalate, onDismiss, onNavigate }) {
      return (
        <div className="space-y-6">
          <div className="gov-card rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-l-4 border-l-amber-500">
            <div>
              <div className="inline-flex items-center gap-2 text-xs font-mono font-bold uppercase text-amber-700">
                <Icon name="cpu" className="w-4 h-4" /> Simulated AI Behavioral & Telemetry Sentinel
              </div>
              <h2 className="text-xl font-extrabold text-gov-900 mt-1">Real-Time Anomaly Detections ({db.aiAlerts.length})</h2>
              <p className="text-xs text-slate-600 mt-0.5">
                AI models continuously analyze GPS trajectories, accelerometer spikes, and geo-fence proximity to flag anomalies before manual SOS.
              </p>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-5">
            {db.aiAlerts.map(alert => (
              <div key={alert.id} className="gov-card rounded-xl p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono font-bold text-sky-700">{alert.id} • {alert.timestamp}</span>
                    <span className={`px-2.5 py-1 rounded-full text-xs font-extrabold border ${
                      alert.riskScore >= 85 ? 'bg-red-50 text-red-700 border-red-200' :
                      'bg-amber-50 text-amber-800 border-amber-200'
                    }`}>
                      AI Risk Score: {alert.riskScore}/100
                    </span>
                  </div>

                  <div>
                    <h3 className="text-base font-extrabold text-gov-900">{alert.type}</h3>
                    <div className="text-xs text-slate-600 mt-0.5">
                      Tourist: <strong>{alert.touristName}</strong> <span className="font-mono text-slate-500">({alert.touristId})</span>
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-gov-50 border border-slate-200 space-y-1.5 text-xs">
                    <div className="text-amber-800 font-bold">Trigger: {alert.reason}</div>
                    <div className="text-slate-700"><strong>AI Explanation:</strong> {alert.explanation}</div>
                    <div className="text-teal-800 font-medium"><strong>Recommended Action:</strong> {alert.recommendation}</div>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
                  <button
                    onClick={() => onEscalate(alert.id)}
                    className="px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-2xs"
                  >
                    <Icon name="siren" className="w-3.5 h-3.5" />
                    {alert.status === 'Escalated' ? 'Create Another Ticket' : 'Escalate to Incident'}
                  </button>
                  <button
                    onClick={() => onNavigate('tourists')}
                    className="px-3 py-2 rounded-lg bg-white hover:bg-slate-50 text-gov-900 border border-slate-300 text-xs font-bold"
                  >
                    View Tourist
                  </button>
                  <button
                    onClick={() => onDismiss(alert.id)}
                    className="px-3 py-2 rounded-lg text-slate-500 hover:text-slate-800 text-xs font-semibold ml-auto"
                  >
                    Dismiss
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 8D. Geo-Fencing Management View
    function GeoFencingView({ db, onAddZone, onSimulateBreach }) {
      const [name, setName] = useState('');
      const [type, setType] = useState('Restricted');
      const [riskLevel, setRiskLevel] = useState('High');
      const [preset, setPreset] = useState('anjuna');
      const [radius, setRadius] = useState(750);

      const presets = {
        anjuna: { label: 'Anjuna Cliff & Reef (Goa)', lat: 15.5765, lng: 73.7360 },
        baga: { label: 'Baga River Mouth (Goa)', lat: 15.5612, lng: 73.7495 },
        mulshi: { label: 'Mulshi Dam Steep Gorge (Pune)', lat: 18.5040, lng: 73.5130 },
        shaniwar: { label: 'Pune Old City Heritage Zone', lat: 18.5196, lng: 73.8553 }
      };

      const handleCreate = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const coords = presets[preset];
        onAddZone({
          name,
          type,
          riskLevel,
          lat: coords.lat,
          lng: coords.lng,
          radius: Number(radius),
          description: `Authority-configured ${type} perimeter near ${coords.label}.`
        });
        setName('');
      };

      return (
        <div className="space-y-6">
          <div className="grid lg:grid-cols-12 gap-6">
            {/* Create Zone Form */}
            <div className="lg:col-span-4 gov-card rounded-xl p-6 space-y-4">
              <h2 className="text-lg font-extrabold text-gov-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                <Icon name="plus-square" className="w-5 h-5 text-teal-600" /> Deploy Geo-Fence Zone
              </h2>

              <form onSubmit={handleCreate} className="space-y-3.5 text-xs">
                <div>
                  <label className="block text-slate-700 font-bold mb-1">Zone Name</label>
                  <input
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="e.g., Anjuna North Reef Hazard"
                    className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-gov-900"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Zone Classification</label>
                    <select value={type} onChange={e => setType(e.target.value)} className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-gov-900 font-semibold">
                      <option value="Safe">Safe Zone</option>
                      <option value="Warning">Warning Zone</option>
                      <option value="Restricted">Restricted Zone</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Risk Level</label>
                    <select value={riskLevel} onChange={e => setRiskLevel(e.target.value)} className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-gov-900 font-semibold">
                      <option value="Low">Low</option>
                      <option value="Moderate">Moderate</option>
                      <option value="High">High</option>
                      <option value="Critical">Critical</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-slate-700 font-bold mb-1">Coordinate Sector</label>
                  <select value={preset} onChange={e => setPreset(e.target.value)} className="w-full bg-gov-50 border border-slate-300 rounded-xl px-3 py-2 text-gov-900 font-semibold">
                    {Object.entries(presets).map(([k, v]) => (
                      <option key={k} value={k}>{v.label}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-700 font-bold mb-1">Radius (meters): {radius}m</label>
                  <input type="range" min="300" max="2000" step="50" value={radius} onChange={e => setRadius(e.target.value)} className="w-full accent-teal-600" />
                </div>

                <button type="submit" className="w-full py-3 rounded-xl bg-gov-900 hover:bg-gov-800 text-white font-bold text-xs shadow-xs">
                  Activate Geo-Fence Perimeter
                </button>
              </form>
            </div>

            {/* Interactive Map */}
            <div className="lg:col-span-8">
              <InteractiveSafetyMap
                tourists={db.tourists}
                zones={db.zones}
                incidents={db.incidents}
                teams={db.responseTeams}
                heightClass="h-[410px]"
              />
            </div>
          </div>

          {/* Active Zones List with Breach Simulator */}
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {db.zones.map(z => (
              <div key={z.id} className="gov-card rounded-xl p-5 flex flex-col justify-between space-y-3">
                <div>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono font-semibold text-slate-500">{z.id} • {z.radius}m</span>
                    <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold border ${
                      z.type === 'Safe' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' :
                      z.type === 'Restricted' ? 'bg-red-50 border-red-200 text-red-700' :
                      'bg-amber-50 border-amber-200 text-amber-800'
                    }`}>
                      {z.type.toUpperCase()}
                    </span>
                  </div>
                  <div className="text-sm font-bold text-gov-900 mt-1.5">{z.name}</div>
                  <p className="text-xs text-slate-600 mt-1">{z.description}</p>
                </div>

                {z.type !== 'Safe' && (
                  <button
                    onClick={() => onSimulateBreach(z)}
                    className="w-full py-2 rounded-lg bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 text-xs font-bold flex items-center justify-center gap-1.5 transition"
                  >
                    <Icon name="alert-triangle" className="w-3.5 h-3.5" /> Simulate Tourist Zone Breach
                  </button>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 8E. Smart IoT Devices View
    function SmartDevicesView({ db, onTriggerBandSOS, onNavigate }) {
      return (
        <div className="space-y-6">
          <div className="gov-card rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-l-4 border-l-sky-600">
            <div>
              <h2 className="text-xl font-extrabold text-gov-900">SAFEWAY IoT Safety Wearables ({db.devices.length})</h2>
              <p className="text-xs text-slate-600 mt-0.5">
                Ruggedized LoRaWAN + GNSS wrist bands issued for coastal water-sports and Sahyadri hill trekking. Triggering Physical SOS creates a live incident.
              </p>
            </div>
          </div>

          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            {db.devices.map(dev => (
              <div key={dev.id} className="gov-card rounded-xl p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-xs font-bold text-sky-700">{dev.id}</span>
                  <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${
                    dev.status === 'SOS Triggered' ? 'bg-red-600 text-white border-red-600' :
                    dev.status === 'Warning' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                    'bg-emerald-50 border-emerald-200 text-emerald-700'
                  }`}>
                    {dev.status.toUpperCase()}
                  </span>
                </div>

                <div>
                  <div className="text-base font-extrabold text-gov-900">{dev.touristName}</div>
                  <div className="text-xs font-mono text-slate-500">{dev.touristId}</div>
                </div>

                <div className="grid grid-cols-3 gap-2 p-3 rounded-xl bg-gov-50 border border-slate-200 text-center text-xs">
                  <div>
                    <div className="text-slate-500 text-[10px] font-semibold">Battery</div>
                    <div className="font-bold text-emerald-700">{dev.battery}%</div>
                  </div>
                  <div>
                    <div className="text-slate-500 text-[10px] font-semibold">Pulse</div>
                    <div className="font-bold text-red-600">{dev.heartRate} bpm</div>
                  </div>
                  <div>
                    <div className="text-slate-500 text-[10px] font-semibold">Link</div>
                    <div className="font-bold text-gov-900 truncate">{dev.connectivity.split('+')[0]}</div>
                  </div>
                </div>

                <div className="text-xs text-slate-600 flex items-center gap-1.5">
                  <Icon name="map-pin" className="w-3.5 h-3.5 text-teal-600" /> {dev.location}
                </div>

                <button
                  onClick={() => {
                    onTriggerBandSOS(dev.touristId);
                    onNavigate('incidents');
                  }}
                  className="w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-xs transition"
                >
                  <Icon name="radio" className="w-4 h-4" /> Trigger Physical Band SOS
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 8F. Monitored Tourists Directory
    function TouristsDirectoryView({ db }) {
      const [query, setQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');

      const filtered = db.tourists.filter(t => {
        const matchesQ = t.name.toLowerCase().includes(query.toLowerCase()) || t.id.toLowerCase().includes(query.toLowerCase()) || t.nationality.toLowerCase().includes(query.toLowerCase());
        const matchesS = statusFilter === 'All' || t.status === statusFilter;
        return matchesQ && matchesS;
      });

      return (
        <div className="space-y-5">
          <div className="gov-card rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
            <input
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="Search 20 registered tourists by Name, Digital ID, or Country..."
              className="flex-1 min-w-[240px] bg-gov-50 border border-slate-300 rounded-xl px-4 py-2 text-xs text-gov-900 focus:border-teal-600 focus:bg-white focus:outline-none"
            />
            <div className="flex gap-2">
              {['All', 'Safe', 'Caution', 'Emergency'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    statusFilter === st ? 'bg-gov-900 text-white' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          <div className="gov-card rounded-xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-gov-900 text-white font-mono text-[11px] uppercase">
                    <th className="py-3.5 px-4">Tourist & Digital ID</th>
                    <th className="py-3.5 px-4">Nationality</th>
                    <th className="py-3.5 px-4">Current GPS Sector</th>
                    <th className="py-3.5 px-4">Safety Score</th>
                    <th className="py-3.5 px-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {filtered.map(tr => (
                    <tr key={tr.id} className="hover:bg-slate-50">
                      <td className="py-3.5 px-4">
                        <div className="font-bold text-gov-900">{tr.name}</div>
                        <div className="font-mono text-[11px] text-sky-700">{tr.id}</div>
                      </td>
                      <td className="py-3.5 px-4 text-slate-700 font-medium">{tr.nationality}</td>
                      <td className="py-3.5 px-4 text-slate-600">{tr.locationName}</td>
                      <td className="py-3.5 px-4 font-mono font-bold text-gov-900">{tr.safetyScore}/100</td>
                      <td className="py-3.5 px-4">
                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${
                          tr.status === 'Emergency' ? 'bg-red-50 border-red-200 text-red-700' :
                          tr.status === 'Caution' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                          'bg-emerald-50 border-emerald-200 text-emerald-700'
                        }`}>
                          {tr.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 8G. Analytics & Reports View (Responsive Clean SVG Charts)
    function AnalyticsReportsView({ db }) {
      const incidentTypes = [
        { label: 'SOS Emergency', count: db.incidents.filter(i => i.type === 'SOS Emergency').length, color: '#DC2626' },
        { label: 'Zone Breach', count: db.incidents.filter(i => i.type === 'Restricted Zone Entry').length, color: '#D97706' },
        { label: 'Route Deviation', count: db.incidents.filter(i => i.type === 'Route Deviation').length, color: '#0284C7' },
        { label: 'Medical / Inactivity', count: db.incidents.filter(i => i.type === 'Medical Emergency' || i.type === 'Inactivity').length, color: '#0D9488' }
      ];

      const dailyTrends = [
        { day: 'Mon', alerts: 4, resolved: 4 },
        { day: 'Tue', alerts: 6, resolved: 6 },
        { day: 'Wed', alerts: 3, resolved: 3 },
        { day: 'Thu', alerts: 7, resolved: 6 },
        { day: 'Fri', alerts: 5, resolved: 5 },
        { day: 'Sat', alerts: 9, resolved: 8 },
        { day: 'Today', alerts: db.incidents.length, resolved: db.incidents.filter(i => i.status === 'Resolved').length }
      ];

      const hourlyActivity = [42, 38, 35, 31, 45, 78, 125, 180, 220, 260, 295, 310];

      return (
        <div className="space-y-6">
          <div className="grid md:grid-cols-2 gap-6">
            {/* Incident Distribution Bar Chart */}
            <div className="gov-card rounded-xl p-6 space-y-4">
              <h3 className="text-base font-extrabold text-gov-900">Incident Category Distribution</h3>
              <div className="space-y-3.5 pt-2">
                {incidentTypes.map((item, idx) => {
                  const pct = Math.min(100, Math.round((item.count / Math.max(1, db.incidents.length)) * 100));
                  return (
                    <div key={idx} className="space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-slate-700 font-bold">{item.label}</span>
                        <span className="font-mono text-gov-900 font-bold">{item.count} ({pct}%)</span>
                      </div>
                      <div className="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                        <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: item.color }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Daily Emergency & Resolution Trends */}
            <div className="gov-card rounded-xl p-6 space-y-4">
              <div className="flex items-center justify-between">
                <h3 className="text-base font-extrabold text-gov-900">7-Day Incident & Resolution Trends</h3>
                <div className="flex items-center gap-3 text-[11px] font-semibold">
                  <span className="flex items-center gap-1 text-gov-900"><span className="w-2.5 h-2.5 rounded-xs bg-gov-900"></span> Total</span>
                  <span className="flex items-center gap-1 text-teal-700"><span className="w-2.5 h-2.5 rounded-xs bg-teal-600"></span> Resolved</span>
                </div>
              </div>
              <div className="h-48 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-200 pb-2">
                {dailyTrends.map((d, idx) => (
                  <div key={idx} className="flex-1 flex flex-col items-center gap-2">
                    <div className="w-full flex items-end justify-center gap-1 h-36">
                      <div className="w-3 bg-gov-900 rounded-t" style={{ height: `${d.alerts * 12}px` }} title={`Total: ${d.alerts}`} />
                      <div className="w-3 bg-teal-600 rounded-t" style={{ height: `${d.resolved * 12}px` }} title={`Resolved: ${d.resolved}`} />
                    </div>
                    <span className="text-[11px] font-mono font-semibold text-slate-600">{d.day}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Tourist Telemetry Traffic */}
            <div className="gov-card rounded-xl p-6 space-y-4">
              <h3 className="text-base font-extrabold text-gov-900">Active Tourist Telemetry Volume (24h)</h3>
              <svg viewBox="0 0 360 120" className="w-full h-40 overflow-visible">
                <defs>
                  <linearGradient id="areaGradGov" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#0284C7" stopOpacity="0.25" />
                    <stop offset="100%" stopColor="#0284C7" stopOpacity="0.02" />
                  </linearGradient>
                </defs>
                <polygon
                  fill="url(#areaGradGov)"
                  points={`0,120 ${hourlyActivity.map((v, i) => `${i * 32.7},${120 - (v / 320) * 100}`).join(' ')} 360,120`}
                />
                <polyline
                  fill="none"
                  stroke="#0284C7"
                  strokeWidth="3"
                  points={hourlyActivity.map((v, i) => `${i * 32.7},${120 - (v / 320) * 100}`).join(' ')}
                />
              </svg>
              <div className="flex justify-between text-[10px] font-mono font-semibold text-slate-500">
                <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span>
              </div>
            </div>

            {/* Response Time & Safety Breakdown */}
            <div className="gov-card rounded-xl p-6 space-y-4">
              <h3 className="text-base font-extrabold text-gov-900">Response SLA & Fleet Safety Summary</h3>
              <div className="grid grid-cols-2 gap-4 pt-2">
                <div className="p-4 rounded-xl bg-gov-50 border border-slate-200">
                  <div className="text-xs font-semibold text-slate-500">Avg Coastal Dispatch</div>
                  <div className="text-2xl font-extrabold text-teal-700 mt-1">3m 48s</div>
                  <div className="text-[11px] text-slate-500 mt-1">-28% faster than target SLA</div>
                </div>
                <div className="p-4 rounded-xl bg-gov-50 border border-slate-200">
                  <div className="text-xs font-semibold text-slate-500">Geo-Fence Prevention</div>
                  <div className="text-2xl font-extrabold text-sky-700 mt-1">96.4%</div>
                  <div className="text-[11px] text-slate-500 mt-1">Auto-deterred via SMS alerts</div>
                </div>
                <div className="p-4 rounded-xl bg-gov-50 border border-slate-200">
                  <div className="text-xs font-semibold text-slate-500">Tourists in Safe Status</div>
                  <div className="text-2xl font-extrabold text-gov-900 mt-1">
                    {db.tourists.filter(t => t.status === 'Safe').length} / {db.tourists.length}
                  </div>
                </div>
                <div className="p-4 rounded-xl bg-gov-50 border border-slate-200">
                  <div className="text-xs font-semibold text-slate-500">IoT Band Uptime</div>
                  <div className="text-2xl font-extrabold text-emerald-700 mt-1">99.8%</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
